<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QRScan · 批量二维码识别</title>
<style>
  /* ============ QRScan 设计系统落地（standards/design/DESIGN.md） ============ */
  :root {
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --primary-soft: #EFF6FF;
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E3E6EB;
    --text-strong: #1F2329;
    --text-normal: #4E5969;
    --text-muted: #86909C;
    --success: #00B42A;
    --success-soft: #E8FFEA;
    --warning: #FF7D00;
    --warning-soft: #FFF3E8;
    --danger: #F53F3F;
    --danger-soft: #FFECE8;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 4px 16px rgba(31, 35, 41, 0.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", "Consolas", "Menlo", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-strong);
    font-size: 14px;
    line-height: 1.6;
  }

  .app { max-width: 960px; margin: 0 auto; padding: 24px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .privacy-note { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .brand h1 { font-size: 22px; font-weight: 700; }
  .brand .badge {
    font-size: 12px; font-weight: 500; color: var(--primary);
    background: var(--primary-soft); padding: 2px 8px; border-radius: 999px;
  }

  /* Upload zone */
  #upload-zone {
    display: block;
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    user-select: none;
  }
  #upload-zone:hover, #upload-zone.dragover { border-color: var(--primary); background: var(--primary-soft); }
  #upload-zone .icon { display: block; font-size: 36px; line-height: 1; }
  #upload-zone .main-text { display: block; margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--text-strong); }
  #upload-zone .sub-text { display: block; margin-top: 4px; font-size: 13px; color: var(--text-muted); }

  /* Sections */
  section { margin-top: 24px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head h2 { font-size: 16px; font-weight: 600; }

  /* Preview grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    position: relative;
  }
  .card .thumb-wrap { position: relative; height: 96px; border-radius: var(--radius); overflow: hidden; background: var(--bg); }
  .card .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .seq {
    position: absolute; top: 6px; left: 6px;
    font-size: 12px; font-weight: 500; color: var(--primary);
    background: var(--primary-soft); padding: 1px 8px; border-radius: 999px;
  }
  .card .status-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 6px; }
  .card .fname { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .count-badge { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .count-badge.ok { color: var(--success); background: var(--success-soft); }
  .count-badge.warn { color: var(--warning); background: var(--warning-soft); }
  .count-badge.loading { color: var(--primary); background: var(--primary-soft); }
  .spinner {
    width: 12px; height: 12px; border: 2px solid var(--primary-soft);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .count { font-size: 14px; color: var(--text-normal); }
  .count strong { color: var(--primary); font-size: 16px; }

  /* Buttons */
  .btn {
    font-family: var(--font); font-size: 14px; font-weight: 500;
    border: 1px solid transparent; border-radius: var(--radius);
    padding: 8px 16px; cursor: pointer; min-height: 36px;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.default { background: var(--surface); border-color: var(--border); color: var(--text-normal); }
  .btn.default:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.danger.confirming { background: var(--danger); color: #fff; }
  .btn.sm { padding: 3px 12px; min-height: 28px; font-size: 13px; border-radius: 6px; }

  /* Result list */
  .result-item {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .result-item:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .result-index { font-size: 13px; color: var(--text-muted); min-width: 34px; padding-top: 2px; }
  .result-body { flex: 1; min-width: 0; }
  .result-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-normal); margin-bottom: 4px; }
  .src-tag {
    font-size: 12px; color: var(--primary); background: var(--primary-soft);
    padding: 1px 8px; border-radius: 999px; max-width: 240px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .result-text {
    font-family: var(--mono); font-size: 13px; color: var(--text-strong);
    word-break: break-all; white-space: pre-wrap; line-height: 1.5;
  }
  .result-copy { flex-shrink: 0; margin-top: 2px; }
  .btn.copied { background: var(--success); border-color: var(--success); color: #fff; }

  /* Empty state */
  .empty { text-align: center; color: var(--text-muted); padding: 48px 0; }
  .empty .icon { font-size: 40px; opacity: 0.5; }
  .empty p { margin-top: 8px; font-size: 14px; }

  /* Toast */
  #toast {
    position: fixed; right: 24px; bottom: 24px;
    background: var(--surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 12px 20px; font-size: 14px;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 100; max-width: 360px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast .t-success { color: var(--success); font-weight: 600; }
  #toast .t-error { color: var(--danger); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* Update modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 24px; max-width: 440px; width: 100%;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px; border: none; background: transparent;
    border-radius: 6px; cursor: pointer; font-size: 15px; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--bg); color: var(--text-strong); }
  .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .update-info { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--text-normal); margin-bottom: 12px; }
  .update-notes {
    font-size: 13px; color: var(--text-normal); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 16px; max-height: 160px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  .modal-actions, .update-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* 下载进度条 */
  .update-progress {
    margin: 8px 0 16px;
  }
  .progress-bar {
    height: 8px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--border); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--primary); border-radius: 999px;
    transition: width 0.2s ease;
  }
  .progress-text {
    display: block; text-align: center;
    font-size: 12px; color: var(--text-muted); margin-top: 6px;
  }

  /* ============ 自定义标题栏 ============ */
  #titlebar {
    -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
    height: 38px; padding: 0 8px 0 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 80;
  }
  #titlebar.is-mac { padding-left: 78px; } /* 给 macOS 红绿灯留位 */
  #title-text {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-normal); cursor: pointer;
    border-radius: 4px; padding: 3px 8px;
    transition: background 0.15s ease; white-space: nowrap;
  }
  #title-text:hover { background: var(--primary-soft); }
  #title-text .ver { color: var(--text-muted); font-weight: 400; }
  #title-text .update-dot { color: var(--primary); font-size: 12px; }
  .win-controls { display: flex; align-items: center; gap: 2px; }
  .win-controls button {
    width: 40px; height: 30px; border: none; background: transparent; cursor: pointer;
    font-size: 13px; color: var(--text-normal); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .win-controls button:hover { background: var(--bg); }
  .win-controls button.close:hover { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div id="titlebar" data-tauri-drag-region>
  <span id="title-text" data-tauri-drag-region="false" title="点击检查更新">
    QRScan · <span class="ver" id="version-text">批量二维码识别 v0.2.0</span>
    <span class="update-dot" id="update-dot" hidden>🔄</span>
  </span>
  <div class="win-controls" id="win-controls">
    <button id="win-min" title="最小化" aria-label="最小化">─</button>
    <button id="win-max" title="最大化/还原" aria-label="最大化">▢</button>
    <button id="win-close" class="close" title="关闭" aria-label="关闭">✕</button>
  </div>
</div>
<div class="app">
  <header>
    <div class="brand">
      <h1>QRScan</h1>
      <span class="badge">批量二维码识别</span>
    </div>
    <div class="header-actions">
      <button class="btn primary" id="capture-btn">📷 屏幕识别</button>
      <span class="privacy-note">🔒 图片仅在本地识别，不会上传</span>
    </div>
  </header>

  <label id="upload-zone" aria-label="上传图片">
    <span class="icon">📁</span>
    <span class="main-text">点击选择或拖拽图片到此处</span>
    <span class="sub-text">支持一次选择多张 PNG / JPG / WebP / BMP / GIF</span>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" multiple hidden />
  </label>

  <section id="preview-section" hidden>
    <div class="section-head">
      <h2>图片预览</h2>
    </div>
    <div class="grid" id="preview-grid"></div>
  </section>

  <section id="results-section" hidden>
    <div class="section-head">
      <h2>识别结果</h2>
      <div class="toolbar">
        <span class="count">共 <strong id="result-count">0</strong> 条</span>
        <button class="btn primary" id="copy-all-btn" disabled>📋 复制全部</button>
        <button class="btn danger" id="clear-btn">🗑 清空</button>
      </div>
    </div>
    <div id="result-list"></div>
  </section>
</div>

<output id="toast" aria-live="polite"></output>

<script src="lib/zxing_reader.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 状态 ============ */
  /** @type {Array<{id:number, file:File, url:string, status:string, count:number}>} */
  var images = [];
  /** @type {Array<{id:string, imageIndex:number, imageName:string, text:string}>} */
  var results = [];
  var nextImageId = 1;
  var clearConfirming = false;

  var MAX_IMAGE_EDGE = 2048;      // 识别用画布最大边长（像素）

  // zxing-wasm：定位本地 wasm 文件（默认走 CDN，必须覆盖为本地路径，离线可用）
  var zxingReady = null;
  function initZXing() {
    if (zxingReady) return zxingReady;
    ZXingWASM.setZXingModuleOverrides({
      locateFile: function (path, prefix) { return 'lib/' + path; }
    });
    // 触发 wasm 初始化（prepare 并缓存 module，避免首次识别卡顿）
    zxingReady = ZXingWASM.prepareZXingModule({ fireImmediately: true })
      .then(function () { return true; })
      .catch(function (e) { console.error('zxing-wasm init failed', e); return false; });
    return zxingReady;
  }

  var $ = function (id) { return document.getElementById(id); };
  var uploadZone = $('upload-zone');
  var fileInput = $('file-input');
  var previewSection = $('preview-section');
  var previewGrid = $('preview-grid');
  var resultsSection = $('results-section');
  var resultList = $('result-list');
  var resultCount = $('result-count');
  var copyAllBtn = $('copy-all-btn');
  var clearBtn = $('clear-btn');

  /* ============ 上传 ============ */
  uploadZone.addEventListener('click', function () { fileInput.click(); });
  uploadZone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', function () { handleFiles(fileInput.files); fileInput.value = ''; });

  ['dragenter', 'dragover'].forEach(function (ev) {
    uploadZone.addEventListener(ev, function (e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    uploadZone.addEventListener(ev, function (e) { e.preventDefault(); uploadZone.classList.remove('dragover'); });
  });
  uploadZone.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });

  function handleFiles(fileList) {
    var accepted = [];
    for (var f of fileList) {
      if (f.type && f.type.indexOf('image/') === 0) accepted.push(f);
    }
    if (accepted.length === 0) {
      showToast('未检测到图片文件，请选择图片格式（PNG/JPG/WebP/BMP/GIF）', 'error');
      return;
    }
    accepted.forEach(function (file) { addImage(file); });
  }

  function addImage(file) {
    var item = {
      id: nextImageId++,
      file: file,
      url: URL.createObjectURL(file),
      status: 'queued',
      count: 0
    };
    images.push(item);
    previewSection.hidden = false;
    renderPreviewCard(item);
    decodeImage(item); // 逐张识别
  }

  function renderPreviewCard(item) {
    var card = document.createElement('div');
    card.className = 'card';
    card.id = 'img-' + item.id;

    var thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';
    var img = document.createElement('img');
    img.className = 'thumb';
    img.src = item.url;
    img.alt = item.file.name;
    var seq = document.createElement('span');
    seq.className = 'seq';
    seq.textContent = String(item.id).padStart(2, '0');

    var statusRow = document.createElement('div');
    statusRow.className = 'status-row';
    var fname = document.createElement('span');
    fname.className = 'fname';
    fname.textContent = item.file.name;
    fname.title = item.file.name;
    var countBadge = document.createElement('span');
    countBadge.className = 'count-badge loading';
    countBadge.textContent = '识别中';

    thumbWrap.appendChild(img);
    thumbWrap.appendChild(seq);
    statusRow.appendChild(fname);
    statusRow.appendChild(countBadge);
    card.appendChild(thumbWrap);
    card.appendChild(statusRow);
    previewGrid.appendChild(card);

    // 图片加载失败（损坏文件）
    img.onerror = function () {
      countBadge.className = 'count-badge warn';
      countBadge.textContent = '图片损坏';
      item.status = 'done';
    };
  }

  function updatePreviewCard(item) {
    var card = $('img-' + item.id);
    if (!card) return;
    var badge = card.querySelector('.count-badge');
    if (item.status === 'decoding') {
      badge.className = 'count-badge loading';
      badge.textContent = '识别中';
    } else if (item.status === 'done') {
      if (item.count > 0) {
        badge.className = 'count-badge ok';
        badge.textContent = item.count + ' 个码';
      } else {
        badge.className = 'count-badge warn';
        badge.textContent = '未识别到二维码';
      }
    }
  }

  /* ============ 识别引擎（zxing-wasm，一次识别单图全部码） ============ */
  function decodeImage(item) {
    item.status = 'decoding';
    updatePreviewCard(item);

    initZXing().then(function (ok) {
      if (!ok) {
        item.status = 'done';
        updatePreviewCard(item);
        showToast('识别引擎初始化失败，请重新打开应用', 'error');
        return;
      }
      readImageFile(item);
    });
  }

  function readImageFile(item) {
    var fileReader = new FileReader();
    fileReader.onload = function () {
      var img = new Image();
      img.onload = function () { onImageReady(img, item); };
      img.onerror = function () {
        item.status = 'done';
        updatePreviewCard(item);
      };
      img.src = fileReader.result;
    };
    fileReader.readAsDataURL(item.file);
  }

  function onImageReady(img, item) {
    scanImageForQRCodes(img).then(function (texts) {
      item.count = texts.length;
      item.status = 'done';
      texts.forEach(function (text) {
        results.push({
          id: 'r-' + crypto.randomUUID(),
          imageIndex: item.id,
          imageName: item.file.name,
          text: text
        });
      });
      updatePreviewCard(item);
      renderResults();
    });
  }

  /**
   * 单图多二维码识别：zxing-wasm readBarcodesFromImageData 一次返回图内全部码。
   * 大图先等比缩小到 MAX_IMAGE_EDGE 以内，控制识别耗时。
   * @returns {Promise<string[]>} 识别出的二维码内容列表
   */
  function scanImageForQRCodes(img) {
    var canvas = document.createElement('canvas');
    var scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) return Promise.resolve([]);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    return ZXingWASM.readBarcodesFromImageData(imageData, {
      tryHarder: true,
      tryRotate: true,
      formats: ['QRCode'],
      maxNumberOfSymbols: 100
    }).then(function (codes) {
      return codes
        .map(function (c) { return c.text; })
        .filter(function (t) { return t && t.length > 0; });
    }).catch(function (e) {
      console.error('decode failed', e);
      return [];
    });
  }

  /* ============ 结果列表 ============ */
  function renderResults() {
    resultsSection.hidden = false;
    resultCount.textContent = String(results.length);
    copyAllBtn.disabled = results.length === 0;
    resultList.innerHTML = '';

    if (results.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<div class="icon">🖼</div><p>暂无识别结果，上传包含二维码的图片后自动识别</p>';
      resultList.appendChild(empty);
      return;
    }

    results.forEach(function (r, idx) {
      var item = document.createElement('div');
      item.className = 'result-item';

      var idxEl = document.createElement('div');
      idxEl.className = 'result-index';
      idxEl.textContent = '#' + (idx + 1);

      var body = document.createElement('div');
      body.className = 'result-body';

      var meta = document.createElement('div');
      meta.className = 'result-meta';
      var tag = document.createElement('span');
      tag.className = 'src-tag';
      tag.textContent = '图' + r.imageIndex + ' · ' + r.imageName;
      tag.title = r.imageName;
      meta.appendChild(tag);

      var textEl = document.createElement('div');
      textEl.className = 'result-text';
      textEl.textContent = r.text;

      body.appendChild(meta);
      body.appendChild(textEl);

      var copyBtn = document.createElement('button');
      copyBtn.className = 'btn default sm result-copy';
      copyBtn.textContent = '📋 复制';
      copyBtn.setAttribute('aria-label', '复制第 ' + (idx + 1) + ' 条结果');
      copyBtn.addEventListener('click', function () {
        copyText(r.text, function (ok) {
          if (ok) {
            flashCopied(copyBtn);
            showToast('已复制第 ' + (idx + 1) + ' 条结果', 'success');
          } else {
            showToast('复制失败，请手动复制', 'error');
          }
        });
      });

      item.appendChild(idxEl);
      item.appendChild(body);
      item.appendChild(copyBtn);
      resultList.appendChild(item);
    });
  }

  /* ============ 复制 ============ */
  /**
   * 写入剪贴板：优先 Clipboard API，降级 textarea + execCommand。
   * @param {string} text
   * @param {function(boolean):void} done
   */
  function copyText(text, done) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        function () { done(true); },
        function () { legacyCopy(text, done); }
      );
    } else {
      legacyCopy(text, done);
    }
  }

  function legacyCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    done(ok);
  }

  function flashCopied(btn) {
    var original = btn.textContent;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    btn.disabled = true;
    setTimeout(function () {
      btn.textContent = original;
      btn.classList.remove('copied');
      btn.disabled = false;
    }, 1500);
  }

  copyAllBtn.addEventListener('click', function () {
    if (results.length === 0) return;
    var allText = results.map(function (r) { return r.text; }).join('\n');
    copyText(allText, function (ok) {
      if (ok) {
        showToast('已复制全部 ' + results.length + ' 条结果', 'success');
      } else {
        showToast('复制失败，请手动复制', 'error');
      }
    });
  });

  /* ============ 清空 ============ */
  clearBtn.addEventListener('click', function () {
    if (!clearConfirming) {
      clearConfirming = true;
      clearBtn.classList.add('confirming');
      clearBtn.textContent = '确认清空？';
      setTimeout(function () {
        clearConfirming = false;
        clearBtn.classList.remove('confirming');
        clearBtn.textContent = '🗑 清空';
      }, 2000);
      return;
    }
    // 二次确认执行
    clearConfirming = false;
    clearBtn.classList.remove('confirming');
    clearBtn.textContent = '🗑 清空';
    clearAll();
  });

  function clearAll() {
    images.forEach(function (item) { URL.revokeObjectURL(item.url); });
    images = [];
    results = [];
    previewGrid.innerHTML = '';
    resultList.innerHTML = '';
    previewSection.hidden = true;
    resultsSection.hidden = true;
    resultCount.textContent = '0';
    copyAllBtn.disabled = true;
  }

  /* ============ Tauri 桥接（截图 + 更新） ============ */
  var __TAURI__ = window.__TAURI__;
  var isTauri = !!(__TAURI__ && __TAURI__.core);

  function tauriInvoke(cmd, args) {
    return __TAURI__.core.invoke(cmd, args || {});
  }

  /* --- 截图输入（全屏截图直接识别） --- */
  $('capture-btn').addEventListener('click', function () {
    if (!isTauri) { showToast('截图功能需在桌面 App 中使用', 'error'); return; }
    var btn = $('capture-btn');
    btn.disabled = true;
    btn.textContent = '屏幕识别中…';
    tauriInvoke('capture_all')
      .then(function (pngBytes) {
        var arr = new Uint8Array(pngBytes);
        var blob = new Blob([arr], { type: 'image/png' });
        return URL.createObjectURL(blob);
      })
      .then(function (url) {
        decodeScreenshot(url);
      })
      .catch(function (e) {
        console.error('capture_all failed', e);
        showToast('截图失败：' + (e && e.message ? e.message : e), 'error');
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '📷 屏幕识别';
      });
  });

  function decodeScreenshot(url) {
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(function (blob) {
        if (!blob) { showToast('截图处理失败', 'error'); return; }
        var file = new File([blob], 'screenshot-' + Date.now() + '.png', { type: 'image/png' });
        addImage(file);
        showToast('屏幕识别完成', 'success');
      }, 'image/png');
    };
    img.onerror = function () { showToast('截图解码失败', 'error'); };
    img.src = url;
  }

  /* --- 自动更新（启动静默 + 点击标题手动检查） --- */

  function checkForUpdate(manual) {
    if (!__TAURI__.updater) return;
    if (manual) setTitleChecking(true);
    __TAURI__.updater.check()
      .then(function (update) {
        if (!update) {
          if (manual) {
            setTitleChecking(false);
            showToast('当前已是最新版本', 'success');
          }
          return;
        }
        showUpdateDot();
        if (manual) {
          // 手动检查到新版 → 直接弹窗（用户可按需下载安装）
          setTitleChecking(false);
          showUpdateDialog(update, 'manual');
        } else {
          // 启动静默：有新版自动下载，下载完成弹交互
          update.downloadAndInstall()
            .then(function () { showUpdateDialog(update); })
            .catch(function (e) {
              console.error('update download failed', e);
              showToast('更新下载失败：' + (e && e.message ? e.message : e), 'error');
            });
        }
      })
      .catch(function (e) {
        console.error('check update failed', e);
        setTitleChecking(false);
        if (manual) showToast('检查更新失败：' + (e && e.message ? e.message : e), 'error');
      });
  }

  // 手动检查弹窗：发现新版本 → 提供「立即更新」与「稍后」
  // 统一更新弹窗：mode="manual" 手动检查到新版；mode="ready" 静默下载完成
  function showUpdateDialog(update, mode) {
    var existing = $('update-modal');
    if (existing) existing.remove();

    var isManual = mode === 'manual';
    var title = isManual ? '🔄 发现新版本 v' + escapeHtml(update.version)
                         : '🔄 新版本 v' + escapeHtml(update.version) + ' 已就绪';
    var primaryLabel = isManual ? '⬇ 立即更新' : '立即更新并重启';

    var modal = document.createElement('div');
    modal.id = 'update-modal';
    modal.className = 'modal-overlay';
    modal.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="update-title">' +
      '  <button class="modal-close" id="update-close-btn" aria-label="关闭">✕</button>' +
      '  <h2 id="update-title">' + title + '</h2>' +
      '  <div class="update-info">' +
      '    <p>当前版本：<strong>' + escapeHtml(update.currentVersion) + '</strong></p>' +
      '    <p>新版本：<strong>' + escapeHtml(update.version) + '</strong></p>' +
      '  </div>' +
      '  <div class="update-progress" id="update-progress" hidden>' +
      '    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>' +
      '    <span class="progress-text" id="progress-text"></span>' +
      '  </div>' +
      '  <div class="update-notes" id="update-notes">' + escapeHtml(update.body || '暂无更新说明') + '</div>' +
      '  <div class="update-actions">' +
      '    <button class="btn default" id="update-later-btn">' + (isManual ? '稍后再说' : '退出时自动更新') + '</button>' +
      '    <button class="btn primary" id="update-now-btn">' + primaryLabel + '</button>' +
      '  </div>' +
      '</div>';
    document.body.appendChild(modal);

    $('update-close-btn').addEventListener('click', function () { modal.remove(); });
    $('update-later-btn').addEventListener('click', function () {
      modal.remove();
      if (!isManual) showToast('将在退出时自动完成更新', 'success');
    });
    $('update-now-btn').addEventListener('click', function () {
      var btn = $('update-now-btn');
      btn.disabled = true;
      btn.textContent = '更新中…';
      var progress = $('update-progress');
      var fill = $('progress-fill');
      var ptext = $('progress-text');
      progress.hidden = false;
      ptext.textContent = '准备下载…';
      $('update-notes').style.display = 'none';

      var downloaded = 0;
      var total = 0;
      update.downloadAndInstall(function (event) {
        if (event.event === 'Started') {
          total = event.data && event.data.contentLength ? event.data.contentLength : 0;
          ptext.textContent = total ? '开始下载…' : '下载中…';
        } else if (event.event === 'Progress') {
          downloaded += event.data && event.data.chunkLength ? event.data.chunkLength : 0;
          if (total > 0) {
            var pct = Math.min(100, Math.round(downloaded / total * 100));
            fill.style.width = pct + '%';
            ptext.textContent = '下载中 ' + pct + '%';
          } else {
            ptext.textContent = '下载中…';
          }
        } else if (event.event === 'Finished') {
          fill.style.width = '100%';
          ptext.textContent = '下载完成，正在安装…';
        }
      }).then(function () {
        showToast('更新完成，即将重启', 'success');
        setTimeout(function () {
          if (__TAURI__.process) __TAURI__.process.relaunch();
        }, 1500);
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = primaryLabel;
        ptext.textContent = '更新失败：' + (e && e.message ? e.message : e);
        showToast('更新失败：' + (e && e.message ? e.message : e), 'error');
      });
    });
  }

  function initTitleBar() {
    var titleText = $('title-text');
    var versionText = $('version-text');

    // 显示当前版本号
    if (__TAURI__.app) {
      __TAURI__.app.getVersion().then(function (v) {
        versionText.textContent = '批量二维码识别 v' + v;
      }).catch(function () { /* 忽略 */ });
    }

    // 点击标题 → 手动检查更新
    titleText.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.win-controls')) return;
      if (__TAURI__.updater) {
        titleText.style.pointerEvents = 'none';
        setTimeout(function () { titleText.style.pointerEvents = ''; }, 2000);
        checkForUpdate(true);
      }
    });

    // mac 平台：保留原生红绿灯，隐藏自绘窗口控制按钮
    var isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');
    if (isMac) {
      $('win-controls').style.display = 'none';
      document.getElementById('titlebar').classList.add('is-mac');
    }

    // 窗口控制
    var winControl = __TAURI__.window.getCurrentWindow();
    $('win-min').addEventListener('click', function () { winControl.minimize(); });
    $('win-max').addEventListener('click', function () { winControl.toggleMaximize(); });
    $('win-close').addEventListener('click', function () { winControl.close(); });
  }

  function setTitleChecking(on) {
    var t = $('title-text');
    if (on) { t.style.opacity = '0.6'; } else { t.style.opacity = ''; }
  }

  function showUpdateDot() {
    var dot = $('update-dot');
    if (dot) dot.hidden = false;
  }

  // 启动后静默检查一次（有新版本自动下载，下载完成弹窗交互）
  if (isTauri) {
    initTitleBar();
    setTimeout(function () { checkForUpdate(false); }, 3000);
  }


  /* ============ Toast ============ */
  var toastTimer = null;
  function showToast(msg, type) {
    var toast = $('toast');
    toast.innerHTML = '<span class="t-' + (type || 'success') + '">' + (type === 'error' ? '⚠ ' : '✓ ') + '</span>' +
      escapeHtml(msg);
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 启动时预加载识别引擎（wasm），避免首次上传时等待
  initZXing();
})();
</script>
