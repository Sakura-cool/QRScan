<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>截屏选区</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas#screen { position: absolute; left: 0; top: 0; }
  #mask { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #sel { position: absolute; border: 2px solid #2563EB; background: rgba(37,99,235,0.12); display: none; z-index: 6; pointer-events: none; }
  #sel-info {
    position: fixed; z-index: 7; background: rgba(15,23,42,0.85); color: #fff;
    font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    padding: 4px 10px; border-radius: 6px; pointer-events: none; display: none;
  }
  #toolbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 8;
    display: flex; gap: 8px; background: rgba(15,23,42,0.85); padding: 8px 12px;
    border-radius: 10px; font: 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; color: #fff;
  }
  #toolbar button {
    font: 13px inherit; border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer;
    background: rgba(255,255,255,0.15); color: #fff;
  }
  #toolbar button.primary { background: #2563EB; }
  #toolbar button:hover { opacity: 0.9; }
  #toolbar .hint { align-self: center; opacity: 0.8; margin-right: 4px; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="screen"></canvas>
</div>
<div id="mask"></div>
<div id="sel"></div>
<div id="sel-info"></div>
<div id="toolbar">
  <span class="hint">拖拽框选 · Esc 取消 · Enter 确认</span>
  <button id="cancel-btn">✕ 取消</button>
  <button id="ok-btn" class="primary">✓ 确定识别</button>
</div>
<script>
(function () {
  'use strict';
  var __TAURI__ = window.__TAURI__;
  var screenCanvas = document.getElementById('screen');
  var ctx = screenCanvas.getContext('2d');
  var selEl = document.getElementById('sel');
  var selInfo = document.getElementById('sel-info');
  var maskEl = document.getElementById('mask');

  var img = null;
  var imgW = 0, imgH = 0;
  var scale = 1;
  var startX = 0, startY = 0;
  var curX = 0, curY = 0;
  var selecting = false;
  var sel = null;

  // capture 窗口加载完成 → 自己截全屏并渲染（数据不跨窗口传输）
  __TAURI__.core.invoke('capture_all')
    .then(function (bytes) {
      var arr = new Uint8Array(bytes);

        imgW = im.naturalWidth;
        imgH = im.naturalHeight;
        fitToScreen();
      };
      im.src = url;
    })
    .catch(function (e) {
      console.error('capture_all failed', e);
      __TAURI__.core.invoke('capture_hide');
    });

  function fitToScreen() {
    var winW = window.innerWidth;
    var winH = window.innerHeight;
    scale = Math.min(winW / imgW, winH / imgH, 1);
    screenCanvas.width = Math.round(imgW * scale);
    screenCanvas.height = Math.round(imgH * scale);
    ctx.drawImage(img, 0, 0, screenCanvas.width, screenCanvas.height);
    // 居中
    screenCanvas.style.left = Math.round((winW - screenCanvas.width) / 2) + 'px';
    screenCanvas.style.top = Math.round((winH - screenCanvas.height) / 2) + 'px';
  }

    var rect = screenCanvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(imgW, (e.clientX - rect.left) / scale)),
      y: Math.max(0, Math.min(imgH, (e.clientY - rect.top) / scale))
    };

    curX = p.x; curY = p.y;
    selecting = true;

    var y = Math.min(startY, curY);
    var w = Math.abs(curX - startX);
    var h = Math.abs(curY - startY);
    sel = { x: x, y: y, w: w, h: h };
    var rect = screenCanvas.getBoundingClientRect();
    var sx = rect.left + x * scale;
    var sy = rect.top + y * scale;

    selEl.style.left = sx + 'px';
    selEl.style.top = sy + 'px';
    selEl.style.width = Math.max(0, w * scale) + 'px';
    selEl.style.height = Math.max(0, h * scale) + 'px';

      selInfo.style.top = (sy + Math.max(0, h * scale) + 8) + 'px';

  }

  document.getElementById('cancel-btn').addEventListener('click', cancelSelection);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') cancelSelection();
    if (e.key === 'Enter') confirmSelection();
  });
})();
</script>
</body>
</html>
