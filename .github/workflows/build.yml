name: Build, Scan & Release QRScan

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 三端三架构构建发布（Node 24） ============
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-universal
            platform: macos-latest
            args: '--target universal-apple-darwin'
          - name: Windows-x64
            platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - name: Ubuntu-x64
            platform: ubuntu-24.04
            args: '--target x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev libwayland-dev

      - name: Install macOS universal target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Rust toolchain
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QRScan ${{ github.ref_name }}'
          releaseBody: |
            QRScan 批量二维码识别工具 v${{ github.ref_name }}

            - Ubuntu x64
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: '[name]-[version]-[platform]-[arch][setup][ext]'
          args: ${{ matrix.args }}

  # ============ Semgrep 持续扫描（三通道 + SARIF） ============
  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: |
          pip install --quiet semgrep
          semgrep --version

      - name: Scan with custom rules
        run: |
          semgrep scan --config .github/semgrep/qrscan-rules.yml \
            --metrics off \
            --exclude target --exclude .package --exclude .github \
            --sarif -o custom.sarif .
        continue-on-error: true

      - name: Scan security-audit (frontend)
        run: |
          semgrep scan --config p/security-audit \
            --metrics off \
            --include "ui/*.html" \
            --sarif -o audit.sarif .
        continue-on-error: true

      - name: Scan rust (Tauri shell)
        run: |
          semgrep scan --config p/rust \
            --metrics off \
            --include "src-tauri/src/*.rs" \
            --sarif -o rust.sarif src-tauri/
        continue-on-error: true

      - name: Fail if findings
        run: |
          FAIL=0
          for f in custom.sarif audit.sarif rust.sarif; do
            [ -f "$f" ] || continue
            CNT=$(python3 -c "import json;d=json.load(open('$f'));print(len(d.get('runs',[{}])[0].get('results',[])))")
            echo "$f: $CNT findings"
            [ "$CNT" != "0" ] && FAIL=1
          done
          exit $FAIL

      - name: Upload custom SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: custom.sarif
          category: semgrep-custom

      - name: Upload audit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: audit.sarif
          category: semgrep-audit

      - name: Upload rust SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust.sarif
          category: semgrep-rust

  # ============ SonarQube 分析（secrets 门控） ============
  sonarqube:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=qrscan
            -Dsonar.projectName=QRScan
            -Dsonar.sources=ui,src-tauri/src
            -Dsonar.exclusions=ui/lib/**/*,src-tauri/target/**/*,src-tauri/gen/**/*,.package/**/*,.github/**/*,dist/**/*
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
