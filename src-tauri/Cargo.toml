[package]
name = "qrscan"
version = "0.1.0"
description = "QRScan - 批量二维码识别工具"
edition = "2021"

[lib]
name = "qrscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
