[package]
name = "qrscan"
version = "0.2.2"
description = "QRScan - 批量二维码识别工具"
edition = "2021"

[lib]
name = "qrscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = { version = "0.9", default-features = false, features = ["image"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
